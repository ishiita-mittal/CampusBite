<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — CampusBite</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container-fluid px-4">
    <a class="navbar-brand text-white fw-bold" href="admin.html">
      🍽️ CampusBite <span class="badge bg-primary ms-1">Kitchen &amp; Admin</span>
    </a>
    <div class="d-flex align-items-center gap-3">
      <a href="index.html" class="btn btn-outline-light btn-sm" target="_blank">
        <i class="bi bi-box-arrow-up-right me-1"></i> Customer View
      </a>
      <button id="admin-logout-btn" class="btn btn-danger btn-sm">
        <i class="bi bi-box-arrow-right me-1"></i> Logout
      </button>
    </div>
  </div>
</nav>

<div class="container-fluid px-4 py-4">
  <!-- Metrics Row -->
  <div class="row g-3 mb-4" id="metrics-row">
    <div class="col-sm-6 col-lg-3">
      <div class="metric-card">
        <div class="metric-label"><i class="bi bi-calendar-event me-1"></i> Today's Orders</div>
        <div class="metric-value" id="metric-today">-</div>
      </div>
    </div>
    <div class="col-sm-6 col-lg-3">
      <div class="metric-card">
        <div class="metric-label"><i class="bi bi-layers me-1"></i> Total Orders</div>
        <div class="metric-value text-secondary" id="metric-total">-</div>
      </div>
    </div>
    <div class="col-sm-6 col-lg-3">
      <div class="metric-card">
        <div class="metric-label"><i class="bi bi-fire me-1 text-warning"></i> Active in Kitchen</div>
        <div class="metric-value text-warning" id="metric-active">-</div>
      </div>
    </div>
    <div class="col-sm-6 col-lg-3">
      <div class="metric-card">
        <div class="metric-label"><i class="bi bi-check2-circle me-1 text-success"></i> Completed</div>
        <div class="metric-value text-success" id="metric-completed">-</div>
      </div>
    </div>
  </div>

  <!-- Navigation Tabs -->
  <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active fw-semibold" id="orders-tab" data-bs-toggle="tab" data-bs-target="#orders-pane" type="button" role="tab">
        <i class="bi bi-receipt me-1"></i> Orders Management
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link fw-semibold" id="menu-tab" data-bs-toggle="tab" data-bs-target="#menu-pane" type="button" role="tab">
        <i class="bi bi-egg-fried me-1"></i> Menu Management
      </button>
    </li>
  </ul>

  <div class="tab-content" id="adminTabsContent">
    <!-- ── Orders Pane ────────────────────────────────────────── -->
    <div class="tab-pane fade show active" id="orders-pane" role="tabpanel">
      <!-- Controls -->
      <div class="filter-bar mb-3">
        <div class="row g-2 align-items-center">
          <div class="col-md-5">
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input type="text" id="order-search" class="form-control" placeholder="Search by order # or customer..." />
            </div>
          </div>
          <div class="col-md-4">
            <select id="order-status-filter" class="form-select">
              <option value="">All Statuses</option>
              <option value="Placed">Placed</option>
              <option value="Preparing">Preparing</option>
              <option value="Ready">Ready</option>
              <option value="Completed">Completed</option>
              <option value="Cancelled">Cancelled</option>
            </select>
          </div>
          <div class="col-md-3 text-md-end">
            <button id="refresh-orders-btn" class="btn btn-outline-secondary w-100">
              <i class="bi bi-arrow-clockwise me-1"></i> Refresh Orders
            </button>
          </div>
        </div>
      </div>

      <!-- Orders Table -->
      <div class="table-card">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>Order #</th>
                <th>Time</th>
                <th>Customer</th>
                <th>Status</th>
                <th class="text-end">Total</th>
                <th class="text-center">Action</th>
              </tr>
            </thead>
            <tbody id="orders-table-body">
              <tr>
                <td colspan="6" class="text-center py-4 text-muted">
                  <div class="spinner-border spinner-border-sm me-2"></div> Loading orders...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ── Menu Pane ──────────────────────────────────────────── -->
    <div class="tab-pane fade" id="menu-pane" role="tabpanel">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">Cafeteria Menu Items</h5>
        <button class="btn btn-primary btn-sm" id="btn-add-item">
          <i class="bi bi-plus-lg me-1"></i> Add Menu Item
        </button>
      </div>

      <div class="table-card">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th style="width: 70px;">Image</th>
                <th>Name &amp; Description</th>
                <th>Category</th>
                <th class="text-end">Price</th>
                <th class="text-center">Available</th>
                <th class="text-center">Actions</th>
              </tr>
            </thead>
            <tbody id="menu-table-body">
              <tr>
                <td colspan="6" class="text-center py-4 text-muted">
                  <div class="spinner-border spinner-border-sm me-2"></div> Loading menu items...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── Order Details Modal ────────────────────────────────────── -->
<div class="modal fade" id="orderModal" tabindex="-1" aria-labelledby="orderModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="orderModalLabel">Order Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="order-modal-body">
        <!-- Rendered dynamically -->
      </div>
      <div class="modal-footer d-flex justify-content-between">
        <div id="modal-status-actions" class="d-flex gap-2 align-items-center">
          <!-- Status buttons dynamically inserted based on allowed transitions -->
        </div>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- ── Menu Item Add/Edit Modal ───────────────────────────────── -->
<div class="modal fade" id="menuModal" tabindex="-1" aria-labelledby="menuModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="menu-item-form">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="menuModalLabel">Add Menu Item</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="item-id" />
          <div id="item-form-error" class="alert alert-danger d-none py-2 small"></div>

          <div class="mb-3">
            <label for="item-name" class="form-label fw-semibold">Item Name <span class="text-danger">*</span></label>
            <input type="text" id="item-name" class="form-control" required maxlength="150" placeholder="e.g. Masala Dosa" />
          </div>

          <div class="row g-2 mb-3">
            <div class="col-sm-6">
              <label for="item-category" class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
              <select id="item-category" class="form-select" required>
                <option value="Snacks">Snacks</option>
                <option value="Meals">Meals</option>
                <option value="Beverages">Beverages</option>
                <option value="Desserts">Desserts</option>
              </select>
            </div>
            <div class="col-sm-6">
              <label for="item-price-rupees" class="form-label fw-semibold">Price (₹) <span class="text-danger">*</span></label>
              <input type="number" id="item-price-rupees" class="form-control" required min="0" step="0.5" placeholder="e.g. 50" />
            </div>
          </div>

          <div class="mb-3">
            <label for="item-description" class="form-label fw-semibold">Description</label>
            <textarea id="item-description" class="form-control" rows="2" maxlength="500" placeholder="Brief food description..."></textarea>
          </div>

          <div class="mb-3">
            <label for="item-image-url" class="form-label fw-semibold">Image URL</label>
            <input type="url" id="item-image-url" class="form-control" maxlength="500" placeholder="https://..." />
          </div>

          <div class="form-check form-switch mb-2">
            <input class="form-check-input" type="checkbox" id="item-available" checked />
            <label class="form-check-label fw-semibold" for="item-available">Available for ordering</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" id="save-item-btn" class="btn btn-primary">Save Item</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Toast notifications -->
<div id="toast-container" class="position-fixed bottom-0 end-0 p-3" style="z-index:9999;"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
