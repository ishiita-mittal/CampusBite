<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu — CampusBite</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ── Navigation ─────────────────────────────────────────────── -->
<nav class="navbar navbar-expand-lg sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="index.html">🍽️ Campus<span>Bite</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house me-1"></i>Home</a></li>
        <li class="nav-item"><a class="nav-link active" href="menu.html"><i class="bi bi-grid me-1"></i>Menu</a></li>
        <li class="nav-item"><a class="nav-link" href="track-order.html"><i class="bi bi-search me-1"></i>Track Order</a></li>
        <li class="nav-item"><a class="nav-link" href="orders.html"><i class="bi bi-clock-history me-1"></i>My Orders</a></li>
      </ul>
      <div class="d-flex align-items-center gap-3">
        <a href="checkout.html" class="btn btn-primary position-relative">
          <i class="bi bi-cart3 me-1"></i>Cart
          <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill d-none">0</span>
        </a>
      </div>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div class="section-header mb-3">
    <h2>Our Menu</h2>
    <div class="section-divider"></div>
  </div>

  <!-- ── Filter Bar ──────────────────────────────────────────── -->
  <div class="filter-bar mb-4">
    <div class="row g-2 align-items-end">
      <div class="col-md-4">
        <label for="search-input" class="form-label small fw-semibold mb-1">Search</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input type="search" id="search-input" class="form-control" placeholder="Search items..." />
        </div>
      </div>
      <div class="col-md-3">
        <label for="category-filter" class="form-label small fw-semibold mb-1">Category</label>
        <select id="category-filter" class="form-select">
          <option value="">All Categories</option>
          <option value="Snacks">Snacks</option>
          <option value="Meals">Meals</option>
          <option value="Beverages">Beverages</option>
          <option value="Desserts">Desserts</option>
        </select>
      </div>
      <div class="col-md-3">
        <label for="avail-filter" class="form-label small fw-semibold mb-1">Availability</label>
        <select id="avail-filter" class="form-select">
          <option value="">All Items</option>
          <option value="true">Available</option>
          <option value="false">Unavailable</option>
        </select>
      </div>
      <div class="col-md-2">
        <button id="clear-filters" class="btn btn-outline-secondary w-100">
          <i class="bi bi-x-circle me-1"></i>Clear
        </button>
      </div>
    </div>
  </div>

  <!-- ── Results count ──────────────────────────────────────── -->
  <p id="results-count" class="text-muted small mb-3"></p>

  <!-- ── Menu Grid ──────────────────────────────────────────── -->
  <div id="menu-grid" class="row g-3">
    <div class="col-12 state-container">
      <div class="spinner-border spinner-orange" role="status"><span class="visually-hidden">Loading...</span></div>
      <p class="mt-3">Loading menu…</p>
    </div>
  </div>
</main>

<!-- ── Toast ──────────────────────────────────────────────────── -->
<div id="toast-container" class="position-fixed bottom-0 end-0 p-3" style="z-index:9999;"></div>

<!-- ── Footer ─────────────────────────────────────────────────── -->
<footer class="py-3 mt-auto">
  <div class="container d-flex flex-wrap justify-content-between align-items-center">
    <span>🍽️ <strong>CampusBite</strong> &mdash; Campus Food Ordering System</span>
    <span class="text-muted small">Simulated demo &mdash; no real payments</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/cart.js"></script>
<script src="js/api.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
