<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — CampusBite</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="index.html">🍽️ Campus<span>Bite</span></a>
    <span class="badge bg-dark">Cafeteria Admin</span>
  </div>
</nav>

<main class="container py-5" style="max-width: 440px;">
  <div class="table-card p-4 p-md-5">
    <div class="text-center mb-4">
      <div style="font-size: 3rem;">🔐</div>
      <h3 class="fw-bold mt-2">Admin Portal</h3>
      <p class="text-muted small">Sign in to manage orders and cafeteria menu</p>
    </div>

    <!-- Error message alert -->
    <div id="login-error" class="alert alert-danger d-none py-2 small" role="alert"></div>

    <form id="admin-login-form" novalidate>
      <div class="mb-3">
        <label for="username" class="form-label fw-semibold">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" id="username" class="form-control" placeholder="admin" required autocomplete="username" />
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password" />
        </div>
      </div>

      <button type="submit" id="login-btn" class="btn btn-primary w-100 py-2 fw-semibold">
        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
      </button>
    </form>

    <div class="alert alert-light border small mt-4 mb-0 text-muted">
      <i class="bi bi-info-circle me-1"></i>
      Default development admin can be created using:
      <code>npm run admin:setup</code>
    </div>
  </div>

  <div class="text-center mt-3">
    <a href="index.html" class="text-decoration-none small text-muted">
      <i class="bi bi-arrow-left me-1"></i> Back to Student Cafeteria
    </a>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/admin-login.js"></script>
</body>
</html>
